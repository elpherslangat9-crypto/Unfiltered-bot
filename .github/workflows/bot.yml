name: V38 Live - Perfect 24/7

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency:
  group: v38-live-perfect
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 230

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Africa/Nairobi Time - Kenya/Zambia Prime
        run: |
          sudo timedatectl set-timezone Africa/Nairobi
          echo "✅ TIME SET: $(date)"

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache V38 Memory - PERFECT KEY - No Repeat FT
        uses: actions/cache@v4
        with:
          path: |
            posted_v38.json
            scores_v38.json
            posted.json
            scores.json
          key: v38-perfect-memory-v1
          restore-keys: |
            v38-perfect-memory-v1

      - name: Init Memory If First Run
        run: |
          [ -f posted_v38.json ] || echo '{}' > posted_v38.json
          [ -f scores_v38.json ] || echo '{}' > scores_v38.json
          [ -f posted.json ] || echo '{}' > posted.json
          echo "Memory ready:"
          ls -lh *.json

      - name: Install Deps
        run: |
          pip install --upgrade pip
          pip install requests pytz
          echo "✅ Deps ready - LS + ESPN + API"

      - name: V38 LIVE - NEVER SLEEP - All Eyes
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          echo "🔵 V38 PERFECT LIVE STARTED - $(date)"
          while true; do
            echo "🚀 Starting main.py at $(date)"
            python main.py
            CODE=$?
            echo "⚠️ exited $CODE at $(date)"
            ls -lh *.json 2>/dev/null
            if [ $CODE -eq 0 ]; then sleep 10; else sleep 20; fi
          done
