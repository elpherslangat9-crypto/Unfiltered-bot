name: News + Predictions All Leagues

on:
  schedule:
    - cron: '0,20,40 * * * *'
    - cron: '30 4 * * *'
    - cron: '30 7 * * *'
    - cron: '30 10 * * *'
    - cron: '45 20 * * *'
  workflow_dispatch:

jobs:
  news_pred:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests feedparser Pillow
      - name: Restore
        uses: actions/cache@v4
        with:
          path: |
            posted_news.json
            slips_tracking.json
          key: news-slip-${{ github.run_id }}
          restore-keys: news-slip-
      - name: Run
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python news.py
      - name: Save
        uses: actions/cache@v4
        with:
          path: |
            posted_news.json
            slips_tracking.json
          key: news-slip-${{ github.run_id }}
          restore-keys: news-slip-
