name: News + Predictions All Leagues

on:
  schedule:
    - cron: '*/5 * * * *'   # CHECK NEWS EVERY 5 MIN - POST WHENEVER NEWS
    - cron: '30 4 * * *'    # Predictions morning
    - cron: '30 7 * * *'    # Early slip
    - cron: '30 10 * * *'   # Main slip
    - cron: '45 20 * * *'   # Night update
  workflow_dispatch:

jobs:
  news_pred:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests feedparser Pillow

      - name: Run Bot
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python news.py

      # === FIX FOR REPEAT + CLEAR PHOTOS ===
      # This saves posted_news.json back to repo so it remembers
      - name: Save History - No More Repeat
        run: |
          git config --global user.name "Unfiltered Bot"
          git config --global user.email "bot@unfiltered.com"
          git pull --rebase || true
          git add posted_news.json slips_tracking.json || true
          git diff --staged --quiet || git commit -m "Save posted history [skip ci]"
          git push || echo "Push failed - retry"
