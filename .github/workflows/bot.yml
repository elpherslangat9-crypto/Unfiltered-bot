name: V38 Live - Perfect 24/7

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'  # restarts every 4h = 0 gap 24/7

concurrency:
  group: v38-live-perfect
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 230  # 4h - 10m safe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Africa/Nairobi Time - Kenya/Zambia Prime
        run: |
          sudo timedatectl set-timezone Africa/Nairobi
          echo "✅ TIME SET: $(date)"
          echo "✅ EAT: Africa/Nairobi for 19:00 KPL/Tanzania"

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache V38 Memory - PERFECT KEY - No Repeat FT
        uses: actions/cache@v4
        with:
          path: |
            posted_v38.json
            scores_v38.json
            posted.json
            scores.json
          key: v38-perfect-memory-v1
          restore-keys: |
            v38-perfect-memory-v1

      - name: Init Memory If First Run
        run: |
          [ -f posted_v38.json ] || echo '{}' > posted_v38.json
          [ -f scores_v38.json ] || echo '{}' > scores_v38.json
          [ -f posted.json ] || echo '{}' > posted.json
          echo "Memory ready:"
          ls -lh *.json

      - name: Install Deps
        run: |
          pip install --upgrade pip
          pip install requests pytz
          echo "✅ Deps ready - LS + ESPN + API"

      - name: V38 LIVE - NEVER SLEEP - All Eyes
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          echo "=================================================="
          echo "🔵 V38 PERFECT LIVE STARTED - $(date)"
          echo "👀 Mode: LS 0.4s FIRST -> ESPN 0.5s -> API backup"
          echo "💾 Memory: posted_v38 + scores_v38 CACHED"
          echo "🏷️ Leagues: KPL Zambia Tanzania EPL LaLiga UCL"
          echo "=================================================="

          while true; do
            echo ""
            echo "🚀 Starting main.py at $(date)"
            python main.py
            CODE=$?
            echo "⚠️ main.py exited with $CODE at $(date)"
            echo "💾 Saving memory..."
            ls -lh *.json 2>/dev/null
            if [ $CODE -eq 0 ]; then
              echo "Clean exit - restart in 10s"
              sleep 10
            else
              echo "Crash - heal in 20s"
              sleep 20
            fi
          done
