name: Slips Only - Unfiltered Scores

permissions:
  contents: write

on:
  schedule:
    - cron: '30 4 * * *'    # MORNING 7:30 EAT
    - cron: '30 7 * * *'    # FREEDOM 10:30 EAT
    - cron: '30 9 * * *'    # ACCUMULATIVE 12:30 EAT
    - cron: '30 20 * * *'   # RESULTS 23:30 EAT
  workflow_dispatch:

jobs:
  news_pred:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests Pillow
      - name: Run Bot
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python news.py
      - name: Save History - No More Repeat
        run: |
          git config --global user.name "Unfiltered Bot"
          git config --global user.email "bot@unfiltered.com"
          git pull --rebase || true
          git add posted_bot.json || true
          git diff --staged --quiet || git commit -m "Save posted history [skip ci]"
          git push || echo "Push failed - retry"
