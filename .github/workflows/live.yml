name: V82 Smart Live Bot

on:
  schedule:
    - cron: "*/2 * * * *"   # Every 2 mins - catches every goal!
  workflow_dispatch:

concurrency:
  group: livescore-bot
  cancel-in-progress: false  # Never skip - don't miss goal!

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # FIXED: Was 3, now 5 - busy Saturday needs it

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Download previous bot data
        uses: dawidd6/action-download-artifact@v6
        with:
          name: bot-data
          path: .
          if_no_artifact_found: warn

      - name: Show previous data
        run: |
          echo "--- POSTED ---"
          ls -lh posted.json last_scores.json last_events.json || echo "First run - no files yet"
          wc -l posted.json 2>/dev/null || true

      - name: Run V82 Bot
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python main.py

      - name: Save bot data for next run
        uses: actions/upload-artifact@v4
        with:
          name: bot-data
          path: |
            posted.json
            last_scores.json
            last_events.json
          retention-days: 90
          if-no-files-found: error
