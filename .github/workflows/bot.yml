name: V27 FB ONLY - FASTER THAN TV

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: unfiltered-fb-only
  cancel-in-progress: false

jobs:
  live-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: pip install requests flask

      - name: Run LIVE - Faster Than TV - FB ONLY
        env:
          GITHUB_ACTIONS: "true"
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python main.py
