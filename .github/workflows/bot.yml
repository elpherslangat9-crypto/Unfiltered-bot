name: V48 PRO LIVE
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests pillow --quiet
      - env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
        run: python main.py
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add posted_v38.json posted.json scores_v38.json schedule.json news_titles.json -f || true
          git commit -m "V48" || true
          git push || true
